<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>账本小屋 · 预览</title><link rel="stylesheet" href="preview.css"></head><body><main class="phone"><button class="ledger" id="ledger">📖<span>账本</span></button><div class="hint">点击屋里的物件试试看</div><button class="furniture desk" data-talk="书桌：今天也要把生活整理得井井有条。">📝</button><button class="furniture chair" data-talk="椅子：坐下来歇一会儿，再记一笔。">🪑</button><button class="furniture shelf" data-talk="书架：每一笔记录，都是生活的一页。">📚</button><button class="character" id="character"><span>🐿️</span><i></i></button><div class="speech" id="speech">嗨！今天过得怎么样？</div><section class="dialog" id="dialog" hidden><div class="dialog-card"><button class="close" id="close">×</button><p class="eyebrow">小栗 · 记账助手</p><h1 id="question">你是要记账吗？</h1><div class="choices" id="choices"><button data-next="记账">记账</button><button data-next="入账">入账</button><button data-next="查看账单">查看账单</button></div><div id="entry" hidden><label>这笔钱是用来干什么了？<select id="category"><option>吃饭</option><option>交通</option><option>购物</option><option>居住</option><option>娱乐</option><option>其他</option></select></label><label>金额<input id="amount" type="number" placeholder="例如 18" /></label><button class="save" id="save">记下这一笔</button></div></div></section></main><script src="preview.js"></script></body></html>
